<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>Styles #1, #3-#8, #10: image with a mask that contains the texts.</f:comment>
<figure class="image">
    <f:render partial="Media/Rendering/Image" arguments="{file: file, settings: settings}" />
    <div class="mask">
        <f:render partial="Media/Rendering/ViewInfo" arguments="{file: file, settings: settings}" />
    </div>
</figure>
</html>
